# リプレイ用データと抽出スクリプトの検査
#
# events.jsonl の再生成にはセッション記録（著者の手元にのみある）が要るため、CI では再生成しない。
# 抽出スクリプトの単体テストと、コミットされたデータの形式・公開の条件を検査する。

name: Replay Data

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/data.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/data.yml"

permissions:
  contents: read

jobs:
  test:
    name: 抽出スクリプトとデータの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 抽出スクリプトは 3.9 以上で動くことを前提にしている
          python-version: "3.9"
      - run: python -m pip install -q "jsonschema==4.25.1" pytest
      - run: python -m pytest tools/tests -q
