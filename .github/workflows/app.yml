# Web アプリの検査（型・lint・テスト・ビルド）
# プロセス定義は J-SIX の固定版（process.lock.json）を取得し、SHA-256 を照合してから使う。

name: App

on:
  pull_request:
    paths-ignore:
      - "data/README.md"
      - "docs/**"
      - "tools/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: 型・lint・テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
